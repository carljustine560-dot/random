<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>bulaklak ni chloe</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 50% 20%, #ffffff 0%, transparent 35%),
    linear-gradient(180deg, #a8e5ff 0%, #d9f7ff 55%, #8bcfa4 100%);
}

/* =========================
   FLOWER
========================= */

.flower {
  position: relative;
  width: 430px;
  height: 560px;
  animation: wind 5s ease-in-out infinite;
  transform-origin: 50% 100%;
}

@keyframes wind {
  0%,100% {
    transform: rotate(-2deg);
  }

  50% {
    transform: rotate(3deg);
  }
}

/* =========================
   STEM
========================= */

.stem {
  position: absolute;
  z-index: 2;
  left: 207px;
  top: 175px;
  width: 15px;
  height: 385px;
  border-radius: 100%;
  background:
    linear-gradient(
      90deg,
      #124d35 0%,
      #2b8751 30%,
      #68c879 52%,
      #247246 72%,
      #0d472e 100%
    );
  box-shadow:
    inset 2px 0 2px rgba(255,255,255,.3),
    4px 0 8px rgba(0,60,30,.15);
}

/* =========================
   LEAVES
========================= */

.leaf {
  position: absolute;
  z-index: 3;
  width: 205px;
  height: 65px;
  overflow: hidden;
  background:
    linear-gradient(
      145deg,
      #0b5535,
      #23824b 35%,
      #6bc778 58%,
      #17633d
    );
  border-radius: 100% 0 100% 0;
  box-shadow:
    inset 8px 7px 12px rgba(255,255,255,.15),
    5px 7px 12px rgba(0,50,30,.2);
}

.leaf::before {
  content: "";
  position: absolute;
  width: 180px;
  height: 2px;
  left: 10px;
  top: 32px;
  background: rgba(210,255,215,.65);
  transform: rotate(-2deg);
}

.leaf::after {
  content: "";
  position: absolute;
  width: 145px;
  height: 45px;
  left: 20px;
  top: 10px;
  border-top: 1px solid rgba(220,255,220,.35);
  border-bottom: 1px solid rgba(0,70,30,.25);
  transform: rotate(-12deg);
}

.leaf.left {
  left: 18px;
  top: 390px;
  transform: rotate(-27deg);
  animation: leafLeft 4s ease-in-out infinite;
}

.leaf.right {
  right: 4px;
  top: 335px;
  transform: scaleX(-1) rotate(-34deg);
  animation: leafRight 4.5s ease-in-out infinite;
}

@keyframes leafLeft {
  0%,100% {
    transform: rotate(-27deg);
  }
  50% {
    transform: rotate(-16deg);
  }
}

@keyframes leafRight {
  0%,100% {
    transform: scaleX(-1) rotate(-34deg);
  }
  50% {
    transform: scaleX(-1) rotate(-45deg);
  }
}

/* =========================
   FLOWER HEAD
========================= */

.bloom {
  position: absolute;
  z-index: 5;
  left: 70px;
  top: 0;
  width: 300px;
  height: 300px;
  animation: breathing 4s ease-in-out infinite;
}

@keyframes breathing {
  0%,100% {
    transform: scale(.97);
  }

  50% {
    transform: scale(1.035);
  }
}

/* =========================
   PETALS
========================= */

.petal {
  position: absolute;
  left: 100px;
  top: 28px;
  width: 110px;
  height: 205px;

  background:
    radial-gradient(
      ellipse at 45% 25%,
      rgba(255,255,255,.65) 0 4%,
      transparent 18%
    ),
    linear-gradient(
      135deg,
      #b9e9ff 0%,
      #6dc6ff 22%,
      #318de9 52%,
      #1a5bc0 78%,
      #123d91 100%
    );

  border-radius: 75% 25% 72% 28%;
  transform-origin: 50% 100%;

  box-shadow:
    inset 7px 10px 18px rgba(255,255,255,.4),
    inset -12px -15px 25px rgba(0,35,120,.25),
    0 5px 15px rgba(15,80,160,.18);
}

/* Petal central vein */
.petal::before {
  content: "";
  position: absolute;
  left: 52%;
  top: 15px;
  width: 2px;
  height: 175px;
  border-radius: 50%;
  background: linear-gradient(
    transparent,
    rgba(255,255,255,.65),
    rgba(80,150,255,.2),
    transparent
  );
  transform: rotate(-4deg);
}

/* Petal fine lines */
.petal::after {
  content: "";
  position: absolute;
  left: 20px;
  top: 55px;
  width: 75px;
  height: 115px;
  border-left: 1px solid rgba(255,255,255,.25);
  border-right: 1px solid rgba(0,45,150,.2);
  border-radius: 50%;
  transform: rotate(-8deg);
}

.p1 {
  transform: rotate(-62deg);
}

.p2 {
  transform: rotate(-31deg);
}

.p3 {
  transform: rotate(0deg);
}

.p4 {
  transform: rotate(31deg);
}

.p5 {
  transform: rotate(62deg);
}

/* =========================
   INNER PETALS
========================= */

.inner-petal {
  position: absolute;
  left: 110px;
  top: 83px;
  width: 90px;
  height: 155px;

  background:
    linear-gradient(
      145deg,
      #c5eeff,
      #65baff 30%,
      #2674d5 70%,
      #15499e
    );

  border-radius: 80% 20% 75% 25%;
  transform-origin: 50% 100%;

  box-shadow:
    inset 7px 7px 14px rgba(255,255,255,.4),
    inset -7px -10px 15px rgba(0,40,120,.2);
}

.ip1 {
  transform: rotate(-38deg);
}

.ip2 {
  transform: rotate(38deg);
}

/* =========================
   CENTER
========================= */

.center {
  position: absolute;
  z-index: 10;
  left: 121px;
  top: 138px;
  width: 62px;
  height: 62px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      #fffbd0 0 8%,
      #ffe96a 12%,
      #ffc52d 35%,
      #e79416 65%,
      #a95b0c 100%
    );

  box-shadow:
    0 0 12px #ffe56b,
    0 0 30px rgba(255,210,50,.5);

  animation: centerGlow 2s ease-in-out infinite;
}

@keyframes centerGlow {
  0%,100% {
    box-shadow:
      0 0 10px #ffe56b,
      0 0 20px rgba(255,210,50,.4);
  }

  50% {
    box-shadow:
      0 0 22px #fff29a,
      0 0 45px rgba(255,210,50,.7);
  }
}

/* =========================
   STAMENS
========================= */

.stamen {
  position: absolute;
  z-index: 11;
  left: 150px;
  top: 82px;
  width: 4px;
  height: 80px;
  border-radius: 5px;

  background: linear-gradient(
    90deg,
    #d79520,
    #ffe274,
    #c17b0f
  );

  transform-origin: bottom center;
  animation: stamenMove 2.5s ease-in-out infinite;
}

.stamen::after {
  content: "";
  position: absolute;
  left: -5px;
  top: -8px;
  width: 14px;
  height: 14px;
  border-radius: 50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff1a0,
      #e6a321 45%,
      #a85b0b
    );

  box-shadow: 0 0 5px rgba(255,190,30,.7);
}

.s1 {
  transform: rotate(-30deg);
}

.s2 {
  transform: rotate(-10deg);
  animation-delay: .25s;
}

.s3 {
  transform: rotate(12deg);
  animation-delay: .5s;
}

.s4 {
  transform: rotate(30deg);
  animation-delay: .75s;
}

@keyframes stamenMove {
  0%,100% {
    margin-left: 0;
  }

  50% {
    margin-left: 4px;
  }
}

/* =========================
   WATER DROPS
========================= */

.drop {
  position: absolute;
  z-index: 20;
  width: 10px;
  height: 15px;

  border-radius: 60% 60% 65% 65%;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.9),
      rgba(100,200,255,.65)
    );

  box-shadow:
    inset 2px 2px 3px white,
    0 1px 5px rgba(20,120,200,.4);

  animation: dropMove 5s ease-in-out infinite;
}

.drop1 {
  left: 125px;
  top: 125px;
}

.drop2 {
  left: 205px;
  top: 170px;
  animation-delay: 1.5s;
}

.drop3 {
  left: 165px;
  top: 75px;
  animation-delay: 3s;
}

@keyframes dropMove {
  0%,100% {
    transform: translateY(0);
    opacity: .75;
  }

  50% {
    transform: translateY(8px);
    opacity: 1;
  }
}

/* =========================
   FLOATING POLLEN
========================= */

.pollen {
  position: absolute;
  z-index: 30;
  width: 7px;
  height: 7px;

  border-radius: 50%;
  background: #ffe16a;

  box-shadow: 0 0 7px #ffd43b;

  opacity: 0;

  animation: pollenFloat 5s linear infinite;
}

.pollen1 {
  left: 170px;
  top: 150px;
  animation-delay: 1s;
}

.pollen2 {
  left: 215px;
  top: 130px;
  animation-delay: 2.4s;
}

.pollen3 {
  left: 135px;
  top: 180px;
  animation-delay: 3.7s;
}

.pollen4 {
  left: 190px;
  top: 110px;
  animation-delay: 4.5s;
}

@keyframes pollenFloat {
  0% {
    opacity: 0;
    transform: translate(0,0) scale(.4);
  }

  15% {
    opacity: 1;
  }

  50% {
    opacity: .8;
  }

  100% {
    opacity: 0;
    transform: translate(
      80px,
      -130px
    ) rotate(180deg) scale(1.1);
  }
}

/* =========================
   BACKGROUND FIREFLIES
========================= */

.firefly {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #eaff91;

  box-shadow:
    0 0 8px #eaff91,
    0 0 18px #cfff51;

  animation: firefly 4s ease-in-out infinite;
}

.f1 {
  left: 15%;
  top: 25%;
}

.f2 {
  left: 78%;
  top: 35%;
  animation-delay: 1s;
}

.f3 {
  left: 25%;
  top: 70%;
  animation-delay: 2s;
}

.f4 {
  left: 85%;
  top: 75%;
  animation-delay: 3s;
}

@keyframes firefly {
  0%,100% {
    opacity: .2;
    transform: translate(0,0);
  }

  50% {
    opacity: 1;
    transform: translate(15px,-20px);
  }
}
</style>
</head>

<body>

<div class="flower">

  <div class="stem"></div>

  <div class="leaf left"></div>
  <div class="leaf right"></div>

  <div class="bloom">

    <!-- Outer petals -->
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>

    <!-- Inner petals -->
    <div class="inner-petal ip1"></div>
    <div class="inner-petal ip2"></div>

    <!-- Stamens -->
    <div class="stamen s1"></div>
    <div class="stamen s2"></div>
    <div class="stamen s3"></div>
    <div class="stamen s4"></div>

    <!-- Flower center -->
    <div class="center"></div>

    <!-- Water droplets -->
    <div class="drop drop1"></div>
    <div class="drop drop2"></div>
    <div class="drop drop3"></div>

  </div>

  <!-- Floating pollen -->
  <div class="pollen pollen1"></div>
  <div class="pollen pollen2"></div>
  <div class="pollen pollen3"></div>
  <div class="pollen pollen4"></div>

</div>

<!-- Background fireflies -->
<div class="firefly f1"></div>
<div class="firefly f2"></div>
<div class="firefly f3"></div>
<div class="firefly f4"></div>

</body>
</html>
